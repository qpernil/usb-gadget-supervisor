[package]
name = "usb-gadget-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Worker-side USB personality model for usb-gadget-supervisor"
license = "MIT"
publish = false

[package.metadata.cargo-machete]
# Referenced through `#[serde(with = "serde_bytes")]`, which is not a Rust path
# cargo-machete can discover.
ignored = ["serde_bytes"]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
ciborium = "0.2.2"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
