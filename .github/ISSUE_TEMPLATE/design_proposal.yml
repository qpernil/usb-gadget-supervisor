name: Design proposal
description: Propose an architectural, profile, or worker-protocol change
title: "design: "
labels:
  - design
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case should the design address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: Describe the interfaces, ownership boundaries, and lifecycle.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Explain effects on privilege separation, USB identity, and existing workers.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you evaluate?
